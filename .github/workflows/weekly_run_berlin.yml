name: Weekly Python GeoJSON Export Berlin

on:
  schedule:
    - cron: "0 23 * * 0"   # Runs at 23:00 UTC, only on Sunday
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Get cache month
        id: cache-month
        run: echo "month=$(date +'%Y-%m')" >> "$GITHUB_OUTPUT"

      # Unfallatlas zips change only once a year; a monthly key stores newly
      # published years while older months are restored as fallback.
      - name: Cache Unfallatlas downloads
        uses: actions/cache@v4
        with:
          path: unfallatlas_cache
          key: unfallatlas-${{ steps.cache-month.outputs.month }}
          restore-keys: |
            unfallatlas-

      - name: Run src/main.py
        run: |
          python src/main.py Berlin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geojson_exports_tempo30
          path: GEOJSON_EXPORT/Berlin/*.geojson
          if-no-files-found: warn
          
      - name: Generate deployment timestamp
        run: |
          echo "DEPLOY_TIME=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload GeoJSON release + update latest
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_BASE_PATH: ${{ secrets.FTP_BASE_PATH_BERLIN }}
        run: |
          RELEASE_PATH="$FTP_BASE_PATH/releases/$DEPLOY_TIME"

          echo "Deploying release to:"
          echo "$RELEASE_PATH"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF

          set ssl:verify-certificate no

          # Ensure directories exist
          mkdir -p $FTP_BASE_PATH/releases
          mkdir -p $FTP_BASE_PATH/latest
          mkdir -p $RELEASE_PATH

          # Upload immutable release
          mirror -R GEOJSON_EXPORT/Berlin $RELEASE_PATH --overwrite

          # Update latest snapshot
          mirror -R GEOJSON_EXPORT/Berlin $FTP_BASE_PATH/latest --overwrite

          bye
          EOF
          
      - name: Verify uploaded files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_BASE_PATH: ${{ secrets.FTP_BASE_PATH_BERLIN }}
        run: |
      
          RELEASE_PATH="$FTP_BASE_PATH/releases/$DEPLOY_TIME"
      
          echo "Checking uploaded files..."
      
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
      
          set ssl:verify-certificate no
      
          echo ""
          echo "=== RELEASE DIRECTORY ==="
          cls -1 $RELEASE_PATH
      
          echo ""
          echo "=== LATEST DIRECTORY ==="
          cls -1 $FTP_BASE_PATH/latest
      
          bye
          EOF
      
          echo ""
          echo "=== VALIDATION ==="
      
          RELEASE_COUNT=$(lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ssl:verify-certificate no
            cls -1 $RELEASE_PATH/*.geojson;
            bye
          " | wc -l)
      
          if [ "$RELEASE_COUNT" -eq 0 ]; then
            echo "ERROR: No GeoJSON files found on FTP server!"
            exit 1
          fi
      
          echo "SUCCESS: $RELEASE_COUNT GeoJSON files uploaded."
